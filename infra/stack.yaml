AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cloud Notes - Stage 8A & 8B Infrastructure Template.
  Defines ECR repository, S3 storage, Secrets Manager, Security Groups,
  RDS MySQL 8, CloudWatch Log Group, IAM Role, Instance Profile,
  SNS topic, Launch Template, Application Load Balancer,
  Auto Scaling Group, CloudWatch Alarms, and Dashboard.

Parameters:
  ProjectName:
    Type: String
    Default: cloudnotes
    Description: Project name used for resource naming and tagging
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: Must contain only lowercase alphanumeric characters and hyphens.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID of the VPC (typically the default VPC) where resources will reside

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of at least two public subnet IDs in different Availability Zones within the VPC

  AlertEmail:
    Type: String
    Description: Email address for operational alerts and CloudWatch notifications
    AllowedPattern: "^[^@]+@[^@]+\\.[^@]+$"
    ConstraintDescription: Must be a valid email address.

  ImageTag:
    Type: String
    Default: latest
    Description: Tag of the Docker image to deploy from ECR

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for application servers

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS DB instance class for MySQL database

  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Number of days to retain automated RDS backups

  MinCapacity:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
    Description: Initial minimum capacity for the Auto Scaling Group (0 during setup/validation)

  DesiredCapacity:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
    Description: Initial desired capacity for the Auto Scaling Group (0 during initial setup)

  MaxCapacity:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: Maximum capacity for the Auto Scaling Group

  CpuTarget:
    Type: Number
    Default: 50
    MinValue: 10
    MaxValue: 90
    Description: Target average CPU utilization percentage for ASG auto-scaling

Resources:
  # ============================================================================
  # 1. ECR Repository
  # ============================================================================
  EcrRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Sub "${ProjectName}-repo"
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================================
  # 2. S3 Storage Bucket & Bucket Policy
  # ============================================================================
  NotesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-storage-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersionsAndAbortIncomplete
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  NotesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref NotesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTlsAccess
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt NotesBucket.Arn
              - !Sub "${NotesBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ============================================================================
  # 3. Secrets Manager - Application Secret
  # ============================================================================
  AppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "${ProjectName}-app-secret"
      Description: !Sub "Application SECRET_KEY for ${ProjectName}"
      GenerateSecretString:
        SecretStringLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================================
  # 4. Security Groups (Strict Inbound Chain)
  # ============================================================================
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Security group for ${ProjectName} Application Load Balancer"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: "Allow HTTP port 80 traffic from the internet"
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: "Allow outbound traffic"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb-sg"
        - Key: Project
          Value: !Ref ProjectName

  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Security group for ${ProjectName} application instances"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSg
          Description: "Allow application port 8000 only from AlbSg"
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: "Allow outbound traffic (AWS APIs, RDS, ECR)"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-app-sg"
        - Key: Project
          Value: !Ref ProjectName

  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Security group for ${ProjectName} RDS MySQL instance"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSg
          Description: "Allow MySQL port 3306 only from AppSg"
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: "Allow outbound traffic"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db-sg"
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================================
  # 5. RDS MySQL 8 Database & Subnet Group
  # ============================================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "${ProjectName}-db-subnet-group"
      DBSubnetGroupDescription: !Sub "Database subnet group for ${ProjectName}"
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db-subnet-group"
        - Key: Project
          Value: !Ref ProjectName

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      DBName: cloudnotes
      Engine: mysql
      EngineVersion: "8.0"
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: true
      BackupRetentionPeriod: !Ref BackupRetentionDays
      DeletionProtection: false
      DeleteAutomatedBackups: true
      ManageMasterUserPassword: true
      MasterUsername: cloudnotesadmin
      VPCSecurityGroups:
        - !Ref DbSg
      DBSubnetGroupName: !Ref DBSubnetGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db"
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================================
  # 6. CloudWatch Log Group
  # ============================================================================
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/cloudnotes/${ProjectName}"
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================================
  # 7. IAM Role and Instance Profile
  # ============================================================================
  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: !Sub "${ProjectName}-least-privilege-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # S3 read, write, and delete on notes bucket only
              - Sid: S3BucketListAndLocation
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt NotesBucket.Arn

              - Sid: S3ObjectOperations
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${NotesBucket.Arn}/*"

              # Secrets Manager: read the two secrets only (App Secret and RDS Secret)
              - Sid: SecretsManagerRead
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppSecret
                  - !GetAtt DBInstance.MasterUserSecret.SecretArn

              # SSM Parameter Store: read parameters under /cloudnotes/*
              - Sid: SsmParameterStoreRead
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudnotes/*"

              # ECR: authentication token (must be * per AWS API requirements) and image pull from this repo only
              - Sid: EcrAuthorizationToken
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"

              # ECR: pull image layers and metadata from this repository only
              - Sid: EcrPullRepositoryImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt EcrRepository.Arn

              # CloudWatch Logs: stream writes to this project's log group only
              - Sid: CloudWatchLogsLogging
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt AppLogGroup.Arn
                  - !Sub "${AppLogGroup.Arn}:*"

              # Read-only metadata queries for the /api/status endpoint (AWS APIs require * resource)
              - Sid: StatusPageMonitoringReadOnly
                Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - cloudwatch:GetMetricStatistics
                  - rds:DescribeDBInstances
                Resource: "*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-instance-profile"
      Path: /
      Roles:
        - !Ref AppInstanceRole

  # ============================================================================
  # 8. SNS Topic and Alert Subscription
  # ============================================================================
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-alerts"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ============================================================================
  # 9. EC2 Launch Template
  # ============================================================================
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-lt"
      LaunchTemplateData:
        ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt AppInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref AppSg
        MetadataOptions:
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2
          HttpTokens: required
        Monitoring:
          Enabled: true
        CreditSpecification:
          CpuCredits: standard
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash -xe
            # Install and start Docker
            dnf update -y
            dnf install -y docker
            systemctl enable docker
            systemctl start docker

            # Log in to ECR using the instance role
            aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com

            # Run the Cloud Notes application container
            docker run -d --restart always \
              -p 8000:8000 \
              --log-driver awslogs \
              --log-opt awslogs-region=${AWS::Region} \
              --log-opt awslogs-group=${AppLogGroup} \
              -e DB_SECRET_ARN=${DBInstance.MasterUserSecret.SecretArn} \
              -e APP_SECRET_ARN=${AppSecret} \
              -e DB_HOST=${DBInstance.Endpoint.Address} \
              -e DB_NAME=cloudnotes \
              -e STORAGE_BACKEND=s3 \
              -e S3_BUCKET=${NotesBucket} \
              -e AWS_REGION=${AWS::Region} \
              -e ASG_NAME=cloudnotes-asg \
              -e DB_INSTANCE_ID=${DBInstance} \
              -e COOKIE_SECURE=false \
              ${EcrRepository.RepositoryUri}:${ImageTag}
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Project
                Value: !Ref ProjectName
              - Key: Name
                Value: !Sub "${ProjectName}-app"
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Project
              Value: !Ref ProjectName

  # ============================================================================
  # 10. Application Load Balancer, Target Group & Listener
  # ============================================================================
  AppAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSg
      Subnets: !Ref SubnetIds
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-tg"
      Protocol: HTTP
      Port: 8000
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AppAlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppAlb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  # ============================================================================
  # 11. Auto Scaling Group & Scaling Policy
  # ============================================================================
  AppAsg:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: cloudnotes-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinCapacity
      MaxSize: !Ref MaxCapacity
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier: !Ref SubnetIds
      TargetGroupARNs:
        - !Ref AppTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      MetricsCollection:
        - Granularity: 1Minute
      Tags:
        - Key: Project
          Value: !Ref ProjectName
          PropagateAtLaunch: true
        - Key: Name
          Value: !Sub "${ProjectName}-app"
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 0
        MaxBatchSize: 1
        PauseTime: PT5M
        WaitOnResourceSignals: false

  AppScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AppAsg
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref CpuTarget
        EstimatedInstanceWarmup: 120

  # ============================================================================
  # 12. CloudWatch Alarms (4 Alarms)
  # ============================================================================
  # Alarm 1: ASG average CPU above 70% for 2 minutes
  AlarmAsgHighCpu:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-asg-high-cpu"
      AlarmDescription: "ASG average CPU utilization exceeds 70% for 2 minutes"
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AppAsg
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  # Alarm 2: ALB target 5xx count >= 10 in 5 minutes
  AlarmAlbTarget5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-alb-target-5xx"
      AlarmDescription: "ALB target 5XX count is 10 or more in 5 minutes"
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt AppAlb.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt AppTargetGroup.TargetGroupFullName
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  # Alarm 3: Unhealthy host count >= 1 for 2 minutes
  AlarmAlbUnhealthyHosts:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-alb-unhealthy-hosts"
      AlarmDescription: "Unhealthy target host count is 1 or more for 2 minutes"
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt AppAlb.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt AppTargetGroup.TargetGroupFullName
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  # Alarm 4: RDS CPU above 80% for 5 minutes
  AlarmRdsHighCpu:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-rds-high-cpu"
      AlarmDescription: "RDS MySQL CPU utilization exceeds 80% for 5 minutes"
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstance
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  # ============================================================================
  # 13. CloudWatch Dashboard
  # ============================================================================
  AppDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: cloudnotes
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "ASG CPU Utilization",
                "metrics": [
                  [ "AWS/EC2", "CPUUtilization", "AutoScalingGroupName", "cloudnotes-asg" ]
                ],
                "period": 60,
                "stat": "Average",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "ASG In-Service Instances",
                "metrics": [
                  [ "AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "cloudnotes-asg" ]
                ],
                "period": 60,
                "stat": "Average",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "ALB Request Count",
                "metrics": [
                  [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${AppAlb.LoadBalancerFullName}" ]
                ],
                "period": 60,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Target Response Time",
                "metrics": [
                  [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${AppAlb.LoadBalancerFullName}" ]
                ],
                "period": 60,
                "stat": "Average",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "ALB Target 5XX Count",
                "metrics": [
                  [ "AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "LoadBalancer", "${AppAlb.LoadBalancerFullName}" ]
                ],
                "period": 60,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "ALB Healthy Host Count",
                "metrics": [
                  [ "AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${AppTargetGroup.TargetGroupFullName}", "LoadBalancer", "${AppAlb.LoadBalancerFullName}" ]
                ],
                "period": 60,
                "stat": "Average",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 18, "width": 12, "height": 6,
              "properties": {
                "title": "RDS CPU Utilization",
                "metrics": [
                  [ "AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${DBInstance}" ]
                ],
                "period": 60,
                "stat": "Average",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 18, "width": 12, "height": 6,
              "properties": {
                "title": "RDS Database Connections",
                "metrics": [
                  [ "AWS/RDS", "DatabaseConnections", "DBInstanceIdentifier", "${DBInstance}" ]
                ],
                "period": 60,
                "stat": "Average",
                "region": "${AWS::Region}"
              }
            }
          ]
        }

# ==============================================================================
# Outputs
# ==============================================================================
Outputs:
  ProjectName:
    Description: Name of the Cloud Notes project
    Value: !Ref ProjectName

  VpcId:
    Description: VPC ID where resources reside
    Value: !Ref VpcId

  SubnetIds:
    Description: Subnet IDs associated with the stack
    Value: !Join [",", !Ref SubnetIds]

  EcrRepositoryUri:
    Description: URI of the Amazon ECR repository for Docker image pushes
    Value: !GetAtt EcrRepository.RepositoryUri
    Export:
      Name: !Sub "${ProjectName}-EcrRepositoryUri"

  EcrRepositoryArn:
    Description: ARN of the Amazon ECR repository
    Value: !GetAtt EcrRepository.Arn

  S3BucketName:
    Description: Name of the Amazon S3 storage bucket for notes and attachments
    Value: !Ref NotesBucket
    Export:
      Name: !Sub "${ProjectName}-S3BucketName"

  S3BucketArn:
    Description: ARN of the Amazon S3 storage bucket
    Value: !GetAtt NotesBucket.Arn

  AppSecretArn:
    Description: ARN of the Secrets Manager secret for the application SECRET_KEY
    Value: !Ref AppSecret
    Export:
      Name: !Sub "${ProjectName}-AppSecretArn"

  DbSecretArn:
    Description: ARN of the Secrets Manager secret created and managed by RDS for the master database password
    Value: !GetAtt DBInstance.MasterUserSecret.SecretArn
    Export:
      Name: !Sub "${ProjectName}-DbSecretArn"

  DbEndpointAddress:
    Description: Connection endpoint address of the RDS MySQL database instance
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: !Sub "${ProjectName}-DbEndpointAddress"

  DbEndpointPort:
    Description: Connection port of the RDS MySQL database instance
    Value: !GetAtt DBInstance.Endpoint.Port
    Export:
      Name: !Sub "${ProjectName}-DbEndpointPort"

  DbName:
    Description: Database name hosted on the RDS MySQL instance
    Value: cloudnotes

  DbEndpoint:
    Description: Connection host endpoint of the RDS MySQL database instance
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: !Sub "${ProjectName}-DbEndpoint"

  AlbSecurityGroupId:
    Description: Security Group ID for the Application Load Balancer
    Value: !Ref AlbSg
    Export:
      Name: !Sub "${ProjectName}-AlbSecurityGroupId"

  AppSecurityGroupId:
    Description: Security Group ID for the application EC2 instances
    Value: !Ref AppSg
    Export:
      Name: !Sub "${ProjectName}-AppSecurityGroupId"

  DbSecurityGroupId:
    Description: Security Group ID for the RDS MySQL database
    Value: !Ref DbSg
    Export:
      Name: !Sub "${ProjectName}-DbSecurityGroupId"

  LogGroupName:
    Description: CloudWatch Log Group name for application logs
    Value: !Ref AppLogGroup
    Export:
      Name: !Sub "${ProjectName}-LogGroupName"

  LogGroupArn:
    Description: CloudWatch Log Group ARN for application logs
    Value: !GetAtt AppLogGroup.Arn

  InstanceRoleArn:
    Description: IAM Role ARN for application EC2 instances
    Value: !GetAtt AppInstanceRole.Arn

  InstanceProfileArn:
    Description: IAM Instance Profile ARN for application EC2 instances
    Value: !GetAtt AppInstanceProfile.Arn
    Export:
      Name: !Sub "${ProjectName}-InstanceProfileArn"

  InstanceProfileName:
    Description: IAM Instance Profile Name for application EC2 instances
    Value: !Ref AppInstanceProfile

  AlertsTopicArn:
    Description: ARN of the SNS topic for operational alerts
    Value: !Ref AlertsTopic
    Export:
      Name: !Sub "${ProjectName}-AlertsTopicArn"

  LoadBalancerDnsName:
    Description: DNS Name of the Application Load Balancer
    Value: !GetAtt AppAlb.DNSName
    Export:
      Name: !Sub "${ProjectName}-AlbDnsName"

  LoadBalancerUrl:
    Description: HTTP URL of the Application Load Balancer
    Value: !Sub "http://${AppAlb.DNSName}"
    Export:
      Name: !Sub "${ProjectName}-LoadBalancerUrl"

  DashboardUrl:
    Description: CloudWatch Dashboard URL for operational monitoring
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=cloudnotes"
